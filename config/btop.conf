#? Config file for btop v1.x
# Preset 0 = CPU-only view (the graph + per-core + battery), like your screenshot.
# Cycle presets live with the `p` key inside btop.
presets = "cpu:0:default cpu:1:default,mem:1:default,net:1:default,proc:0:default proc:1:default,cpu:0:default"

# CPU-only by default (the screenshot view). Inside btop press 1/2/3/4 to
# toggle cpu/mem/net/proc boxes, or `p` to cycle the presets above.
shown_boxes = "cpu"

color_theme = "Default"
theme_background = False
truecolor = True
vim_keys = True

# CPU view tuning to match the screenshot
cpu_single_graph = True
graph_symbol = "braille"
update_ms = 2000
show_uptime = True
check_temp = True
show_coretemp = True
show_cpu_freq = True

# Battery (top-right bar)
show_battery = True
selected_battery = "Auto"
show_battery_watt = True

# Lighter / cleaner
rounded_corners = True
proc_tree = False
