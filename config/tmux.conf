# ──────────────────────────────────────────────────────────────
#  tmux — crash-proof persistent layer for Ghostty + Claude Code
#  Reload:  prefix + r   (prefix = Ctrl-b)
#  Save now: prefix + Ctrl-s     Restore: prefix + Ctrl-r
# ──────────────────────────────────────────────────────────────

# ── Terminal / color (true color inside Ghostty) ──────────────
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"
set -g  escape-time 0           # no lag for Claude Code / vim ESC
set -g  focus-events on
set -g  history-limit 100000    # deep scrollback per pane

# ── Sane defaults ─────────────────────────────────────────────
set -g  mouse on
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  set-clipboard on
set -g  display-time 2000
set -g  status-interval 5

# ── Reload ────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  config reloaded"

# ── Splits keep current dir (vim-ish) ─────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ⌘W (Ghostty) → kill THIS pane instantly, no y/n prompt.
bind x kill-pane
# vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi copy mode (y to yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar — Zer0-Dark-65 premium ─────────────────────────
# Minimal flat style: no boxy colored blocks. Icons + subtle dots.
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1b1a2e,fg=#c2c2dc"
set -g window-status-separator ""
set -g status-interval 5

# left: cyan session pill
set -g status-left-length 40
set -g status-left "#[fg=#1b1a2e,bg=#56b6c2,bold]  #S #[fg=#56b6c2,bg=#1b1a2e,nobold]#[default]  "

# windows: dot inactive, diamond active (cyan, no colored blocks)
set -g window-status-format "#[fg=#4b5066,bg=#1b1a2e] · #[fg=#6e7a9a]#W "
set -g window-status-current-format "#[fg=#56b6c2,bg=#1b1a2e,bold] ◆ #W #[default]"

# right: save · user · battery · datetime — flat, icon-led
set -g status-right-length 140
set -g status-right "#[fg=#4b5066] 󰤙 #{continuum_status}m  #[fg=#56b6c2]󰀄 #(whoami)#[fg=#4b5066] · #[fg=#e0a44a]#(~/.config/tmux/battery.sh)#[fg=#4b5066] · #[fg=#61afef]󰃰 %a %d %b#[fg=#4b5066] · #[fg=#c2c2dc,bold]%H:%M "

# pane borders — heavy lines + titled (cockpit sets per-pane titles)
set -g pane-border-lines heavy
set -g pane-border-style "fg=#262540"
set -g pane-active-border-style "fg=#61afef"

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Crash / reboot recovery ───────────────────────────────────
# Capture each pane's scrollback so it comes back after a full restore.
set -g @resurrect-capture-pane-contents 'on'
# Restore these programs (not just the shell). Claude Code included —
# it relaunches; run `claude -c` inside to rehydrate the conversation.
set -g @resurrect-processes 'claude "claude -c" nvim vim btop htop node "~yazi" ssh'
set -g @resurrect-strategy-nvim 'session'

# Continuum: auto-save every 2 min (tighter recovery window), auto-restore on start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '2'
# After a restore (reboot/crash) → desktop notification + how to resume chats.
set -g @resurrect-hook-post-restore-all '~/.config/tmux/on-restore.sh'

# ── Popups & dashboard (Warp-style command palette feel) ──────
# prefix + T  → sesh session picker (see/jump/create sessions)
bind T display-popup -E -w 60% -h 60% "sesh connect \"$(
  sesh list --icons | fzf --reverse --border-label ' sessions ' --prompt '  ' )\""
# prefix + D (⌘T) → cockpit scoped to the CURRENT folder you're in
bind D run-shell "~/.config/tmux/dashboard.sh '#{pane_current_path}'"
# prefix + g  → lazygit popup (current pane dir)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
# prefix + G  → lazydocker popup
bind C-g display-popup -E -w 90% -h 90% "lazydocker"
# prefix + e  → yazi file manager popup
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
# prefix + Space → fullscreen scratch popup shell
bind Space display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# prefix + u → jump to your PREVIOUS input in Claude Code (lines starting "> ").
#   Repeat with n (next match up) / N (down). Works with `ccs` scrollable mode.
bind u copy-mode \; send -X search-backward "> "
# prefix + p → visual project launcher (no cd) → opens the project's cockpit
bind p display-popup -E -w 70% -h 80% "~/.config/tmux/project-picker.sh"
# prefix + ? → cheat sheet of everything
bind ? display-popup -E -w 75% -h 85% "bat --style=plain --paging=always ~/.config/tmux/cheatsheet.md 2>/dev/null || less ~/.config/tmux/cheatsheet.md"
# prefix + b → CPU monitor toggle (btop, CPU-only — like the screenshot)
#   Inside btop: press 1/2/3/4 to add boxes, `q` to close.
bind b display-popup -E -w 92% -h 70% "btop"
# prefix + M → matrix rain (vibe break; q to close)
bind M display-popup -E -w 90% -h 90% "cmatrix -b -u 4"
# prefix + a → quick-ask Claude in a popup (side question, closes when done)
bind a display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "claude"
# prefix + F → flex: the showcase rice dashboard (ticker/btop/feeds/yazi)
bind F run-shell "~/.config/tmux/flex.sh"
# prefix + i → toggle macOS dark/light → Ghostty recolors live (premium dark ↔ white coder)
bind i run-shell "~/.config/ghostty/toggle-appearance.sh"

# keep at very bottom
run '~/.tmux/plugins/tpm/tpm'
