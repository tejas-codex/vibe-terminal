# Starship — TokyoNight, fast, git-aware.  Docs: starship.rs/config
add_newline = true
command_timeout = 800

format = """
[](fg:#7aa2f7)\
$os\
$directory\
[](fg:#3b4261 bg:#7aa2f7)\
$git_branch$git_status\
[](fg:#3b4261)\
$nodejs$python$rust$golang$package\
$fill\
$cmd_duration\
$line_break\
$character"""

palette = "tokyonight"

[palettes.tokyonight]
bg     = "#1a1b26"
fg     = "#c0caf5"
blue   = "#7aa2f7"
cyan   = "#7dcfff"
green  = "#9ece6a"
purple = "#bb9af7"
red    = "#f7768e"
orange = "#ff9e64"
grey   = "#565f89"
panel  = "#3b4261"

[os]
disabled = false
style = "bg:#7aa2f7 fg:#16161e"
format = "[ $symbol ]($style)"
[os.symbols]
Macos = ""

[directory]
style = "bg:#7aa2f7 fg:#16161e bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Desktop"   = ""

[git_branch]
style = "bg:#3b4261 fg:#7dcfff"
symbol = ""
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#3b4261 fg:#ff9e64"
format = "[$all_status$ahead_behind ]($style)"

[nodejs]
style = "fg:green"
symbol = " "
format = "[ $symbol($version) ]($style)"
[python]
style = "fg:cyan"
symbol = " "
format = "[ $symbol($version) ]($style)"
[rust]
style = "fg:red"
symbol = " "
format = "[ $symbol($version) ]($style)"
[golang]
style = "fg:cyan"
symbol = " "
format = "[ $symbol($version) ]($style)"
[package]
disabled = true

[fill]
symbol = " "

[cmd_duration]
min_time = 500
style = "fg:grey"
format = "[ 󱎫 $duration ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"
